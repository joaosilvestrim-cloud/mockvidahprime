const money = (n) => "R$ " + Number(n).toFixed(2).replace(".",",");

function VidahPrime() {
  const [view,setView] = useState("landing");
  const [menu,setMenu] = useState(false);
  const [faq,setFaq] = useState(null);
  const [scrollY,setScrollY] = useState(0);

  // Conta / onboarding
  const [account,setAccount] = useState(null);   // {name,email,...,status:'pending'|'approved'}
  const [obStep,setObStep] = useState(0);
  const [obForm,setObForm] = useState({name:"",email:"",phone:"",cpf:"",council:"",councilType:"CRP",spec:"",docs:{carteira:false,endereco:false,pessoal:false},accept:false});
  const [pendingAction,setPendingAction] = useState(null); // rota pretendida antes do cadastro

  // Booking
  const [step,setStep] = useState(0);
  const [room,setRoom] = useState(null);
  const [useMode,setUseMode] = useState(null);
  const [pkg,setPkg] = useState(null);
  const [dates,setDates] = useState([]);
  const [times,setTimes] = useState([]);
  const [calM,setCalM] = useState(new Date().getMonth());
  const [calY,setCalY] = useState(new Date().getFullYear());
  const [pay,setPay] = useState("pix");
  const [fiscal,setFiscal] = useState(false);
  const [lastBooking,setLastBooking] = useState(null);

  // Cliente
  const [hourBalance,setHourBalance] = useState(0);
  const [myBookings,setMyBookings] = useState([]);
  const [clientTab,setClientTab] = useState("resumo");

  // Admin
  const [adminLogged,setAdminLogged] = useState(false);
  const [adminTab,setAdminTab] = useState("aprovacoes");
  const [signups,setSignups] = useState(PENDING_SIGNUPS);
  const [blockedSlots,setBlockedSlots] = useState([]);

  // Chat Vi
  const [chatOpen,setChatOpen] = useState(false);
  const [chatFull,setChatFull] = useState(false);
  const [leadStage,setLeadStage] = useState(0); // captação de lead
  const [lead,setLead] = useState({name:"",email:"",interest:""});
  const [msgs,setMsgs] = useState([{role:"assistant",content:"Olá! Sou a Vi, assistente da Vidah Prime 🌿\n\nPosso ajudar com salas, planos, cadastro e agendamento. E se quiser, conecto você com a equipe.\n\nComo posso te ajudar?"}]);
  const [chatIn,setChatIn] = useState("");
  const chatEnd = useRef(null);

  useEffect(()=>{
    const h = ()=>setScrollY(window.scrollY);
    window.addEventListener("scroll",h);
    return ()=>window.removeEventListener("scroll",h);
  },[]);
  useEffect(()=>{ chatEnd.current?.scrollIntoView({behavior:"smooth"}); },[msgs]);

  const go = (v,s=0) => { setView(v); setStep(s); setMenu(false); window.scrollTo(0,0); };

  // Gate de cadastro: só entra no booking se conta aprovada.
  const requireAccount = (nextView="booking") => {
    if(account && account.status==="approved"){ go(nextView,0); return; }
    setPendingAction(nextView);
    setObStep(account?3:0);
    go("onboarding");
  };
  const startBook = (r=null) => { if(r) setRoom(r); requireAccount("booking"); };

  // ─── Onboarding helpers ───
  const obCanNext = () => {
    if(obStep===0) return obForm.name&&obForm.email&&obForm.phone&&obForm.cpf;
    if(obStep===1) return obForm.council&&obForm.spec;
    if(obStep===2) return obForm.docs.carteira&&obForm.docs.endereco&&obForm.docs.pessoal;
    if(obStep===3) return obForm.accept;
    return true;
  };
  const submitSignup = () => {
    setAccount({...obForm,status:"pending",id:genId()});
    setObStep(4);
  };
  const approveOwnAccount = () => {
    setAccount(a=>({...a,status:"approved"}));
    setObStep(5);
  };

  // ─── Booking helpers ───
  const getDays = (m,y) => {
    const fd = new Date(y,m,1).getDay(), total = new Date(y,m+1,0).getDate();
    const d = Array(fd).fill(null);
    for(let i=1;i<=total;i++) d.push(i);
    return d;
  };
  const isPast = (d) => d && new Date(calY,calM,d) < new Date(new Date().setHours(0,0,0,0));
  const isSoon = (d) => { if(!d) return false; const diff=(new Date(calY,calM,d)-new Date(new Date().setHours(0,0,0,0)))/86400000; return diff>=0&&diff<2; };
  const isDSel = (d) => d && dates.includes(`${calY}-${calM}-${d}`);
  const togDate = (d) => {
    if(!d||isPast(d)) return;
    const k=`${calY}-${calM}-${d}`;
    setDates(p=>p.includes(k)?p.filter(x=>x!==k):[...p,k]);
  };
  const togTime = (t) => setTimes(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);

  const hourRate = () => {
    if(!room) return 0;
    if(useMode?.id==="pacote"&&pkg) return room.priceHora*(1-pkg.off);
    if(useMode?.id==="periodo") return room.priceHora*(1-0.30);
    return room.priceHora;
  };
  const bookingTotal = () => {
    const slots = times.length*Math.max(dates.length,1);
    if(useMode?.id==="pacote"&&pkg) return room.priceHora*(1-pkg.off)*pkg.hours + (fiscal?FISCAL_ADDON.price:0);
    if(useMode?.id==="periodo") return room.priceHora*(1-0.30)*times.length*Math.max(dates.length,1)*4 + (fiscal?FISCAL_ADDON.price:0);
    return hourRate()*slots + (fiscal?FISCAL_ADDON.price:0);
  };

  const bookCanNext = () => {
    if(step===0) return !!room;
    if(step===1) return !!useMode && (useMode.id!=="pacote"||!!pkg);
    if(step===2) return dates.length>0&&times.length>0;
    return true;
  };

  const confirmBooking = () => {
    const b = { id:genId(), room, useMode, pkg, dates:[...dates], times:[...times], total:bookingTotal(), pay, fiscal, when:new Date() };
    setLastBooking(b);
    setMyBookings(p=>[b,...p]);
    if(useMode?.id==="pacote"&&pkg) setHourBalance(bal=>bal + pkg.hours - times.length*Math.max(dates.length,1));
    setStep(4);
  };

  // ─── Chat Vi (mock com captação de lead) ───
  const pushMsg = (role,content) => setMsgs(p=>[...p,{role,content}]);
  const botReply = (u) => {
    const t = u.toLowerCase();
    if(t.includes("sala")) return "Temos Sala Conecta (psicologia e terapias), Sala Clínica (procedimentos e maca), Sala Odontológica (equipada) e a Sala de Reuniões e Palestras. Quer que eu te leve pra ver as salas? 🌿";
    if(t.includes("plano")||t.includes("preç")||t.includes("valor")||t.includes("pacote")) return "Você pode alugar avulso por hora, comprar um pacote (8h, 16h ou 30h com desconto) ou fechar um período fixo. Quanto maior o pacote, mais barata a hora. Quer ver os valores?";
    if(t.includes("cadastr")||t.includes("document")) return "O cadastro é único: você envia carteirinha do conselho, comprovante de endereço e documento pessoal, assina o contrato uma vez e, após validarmos seu registro, já pode reservar. Posso começar seu cadastro?";
    if(t.includes("fiscal")||t.includes("cnpj")) return "Com o adicional de endereço fiscal (contratos de 12 meses) você usa nosso endereço no CNPJ e nos conselhos. Quer que eu chame a equipe pra detalhar?";
    if(t.includes("humano")||t.includes("equipe")||t.includes("falar")||t.includes("atend")) return "__LEAD__";
    return "Posso ajudar com salas, planos, cadastro, endereço fiscal e agendamento. Se preferir, falo com a equipe pra você. O que faz mais sentido? 🙂";
  };
  const sendChat = (directMsg=null) => {
    const u = (directMsg||chatIn).trim();
    if(!u) return;
    if(!directMsg) setChatIn("");
    pushMsg("user",u);

    // Fluxo de captação de lead
    if(leadStage===1){ setLead(l=>({...l,name:u})); setLeadStage(2); setTimeout(()=>pushMsg("assistant",`Prazer, ${u.split(" ")[0]}! Qual o melhor e-mail pra equipe te retornar?`),400); return; }
    if(leadStage===2){ setLead(l=>({...l,email:u})); setLeadStage(3); setTimeout(()=>pushMsg("assistant","Perfeito. Em uma frase, o que você procura? (ex.: 2 turnos de sala odontológica por semana)"),400); return; }
    if(leadStage===3){
      setLead(l=>({...l,interest:u})); setLeadStage(4);
      const score = Math.min(98, 60 + u.length%38);
      setTimeout(()=>pushMsg("assistant",`Tudo certo! ✅ Encaminhei seu contato para a equipe da Vidah Prime.\n\n📋 Lead registrado no CRM\n⭐ Score do profissional: ${score}/100\n\nA Raquel ou o Fernando vão te retornar em breve. Enquanto isso, quer adiantar seu cadastro?`),500);
      return;
    }

    setTimeout(()=>{
      const r = botReply(u);
      if(r==="__LEAD__"){ setLeadStage(1); pushMsg("assistant","Claro! Vou te conectar com a equipe. Qual seu nome?"); }
      else pushMsg("assistant",r);
    },450);
  };

  const navBg = view==="landing" && scrollY<80 ? "transparent" : "rgba(255,255,255,0.97)";
  const navColor = view==="landing" && scrollY<80 ? "#fff" : C.dark;

            ) : (
              <div style={{background:C.goldLight,borderRadius:12,padding:20,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
                <div style={{fontSize:13.5,color:"#8A6420"}}>Você ainda não contratou o endereço fiscal.</div>
                <button style={{background:C.gold,color:"#fff",border:"none",borderRadius:10,padding:"11px 22px",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:F.body}}>Contratar por {money(FISCAL_ADDON.price)}/mês</button>
              </div>
            )}
          </div>
        )}

        {clientTab==="dados" && (
          <div style={{background:C.white,borderRadius:18,padding:28,boxShadow:"0 4px 16px rgba(0,0,0,0.06)"}}>
            <h3 style={{fontFamily:F.display,fontSize:19,fontWeight:700,color:C.dark,marginBottom:18}}>Meus dados</h3>
            {[["Nome",account?.name],["E-mail",account?.email],["WhatsApp",account?.phone],["CPF",account?.cpf],["Registro",`${account?.councilType} ${account?.council}`],["Especialidade",account?.spec]].map(([k,v])=>(
              <div key={k} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",borderBottom:`1px solid ${C.border}`,fontSize:14}}><span style={{color:C.muted}}>{k}</span><span style={{fontWeight:600,color:C.dark}}>{v||"—"}</span></div>
            ))}
            <button onClick={()=>{setAccount(null);go("landing");}} style={{marginTop:20,background:"none",border:`2px solid ${C.border}`,borderRadius:10,padding:"11px 22px",fontSize:14,fontWeight:600,cursor:"pointer",color:C.muted,fontFamily:F.body}}>Sair da conta</button>
          </div>
        )}
      </div>
    </div>
  );

  // ════════════════════════════════════════════ PAINEL ADMINISTRATIVO
  const Admin = () => {
    if(!adminLogged) return (
      <div style={{minHeight:"100vh",background:`linear-gradient(135deg,${C.forest},${C.emerald})`,display:"flex",alignItems:"center",justifyContent:"center",padding:24,paddingTop:88}}>
        <div style={{background:"#fff",borderRadius:24,padding:40,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.25)",textAlign:"center"}}>
          <div style={{fontSize:52,marginBottom:16}}>🔑</div>
          <h2 style={{fontFamily:F.display,fontSize:24,fontWeight:700,color:C.dark,marginBottom:8}}>Painel administrativo</h2>
          <p style={{color:C.muted,fontSize:14,marginBottom:28}}>Vidah Prime · Acesso da equipe (Raquel / Fernando)</p>
          <div style={{marginBottom:16,textAlign:"left"}}>
            <label style={{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:6}}>E-mail</label>
            <input defaultValue="admin@vidahprime.com.br" style={{width:"100%",padding:"12px 14px",border:`2px solid ${C.border}`,borderRadius:10,fontSize:14,boxSizing:"border-box",fontFamily:F.body}}/>
          </div>
          <div style={{marginBottom:24,textAlign:"left"}}>
            <label style={{fontSize:12,fontWeight:600,color:C.dark,display:"block",marginBottom:6}}>Senha</label>
            <input type="password" placeholder="••••••••" style={{width:"100%",padding:"12px 14px",border:`2px solid ${C.border}`,borderRadius:10,fontSize:14,boxSizing:"border-box",fontFamily:F.body}}/>
          </div>
          <button onClick={()=>setAdminLogged(true)} style={{width:"100%",background:C.emerald,color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:15,fontWeight:700,cursor:"pointer",fontFamily:F.body,marginBottom:12}}>Entrar no painel</button>
          <button onClick={()=>go("landing")} style={{width:"100%",background:"none",border:"none",color:C.muted,fontSize:12,cursor:"pointer",fontFamily:F.body}}>← Voltar ao site</button>
        </div>
      </div>
    );

    return (
      <div style={{minHeight:"100vh",background:C.cream,paddingTop:64}}>
        <div style={{background:C.forest,color:"#fff",padding:"14px 22px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:64,zIndex:50}}>
          <div>
            <div style={{fontFamily:F.display,fontSize:18,fontWeight:700}}>🌿 Vidah Prime · Admin</div>
            <div style={{fontSize:12,opacity:0.7}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
          </div>
          <button onClick={()=>{setAdminLogged(false);go("landing");}} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,fontFamily:F.body}}>Sair</button>
        </div>

        <div style={{maxWidth:1200,margin:"0 auto",padding:"22px 20px"}}>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14,marginBottom:24}}>
            {[{l:"Aprovações pendentes",v:signups.length,c:C.warn,e:"📋"},{l:"Agendamentos hoje",v:TODAY_SCHEDULE.filter(s=>s.status!=="cleaning").length,c:C.emerald,e:"📅"},{l:"Em atendimento",v:TODAY_SCHEDULE.filter(x=>x.status==="in_progress").length,c:"#F6AD55",e:"⚡"},{l:"Faturamento mês",v:"R$ 18,4k",c:C.gold,e:"💰"}].map(s=>(
              <div key={s.l} style={{background:C.white,borderRadius:16,padding:"18px 16px",boxShadow:"0 4px 16px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:20,marginBottom:8}}>{s.e}</div>
                <div style={{fontFamily:F.display,fontSize:26,fontWeight:700,color:s.c}}>{s.v}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:4,textTransform:"uppercase",fontWeight:600,letterSpacing:1}}>{s.l}</div>
              </div>
            ))}
          </div>

          {/* Tabs */}
          <div style={{display:"flex",gap:4,marginBottom:22,background:"#fff",borderRadius:12,padding:4,width:"fit-content",boxShadow:"0 2px 8px rgba(0,0,0,0.06)",flexWrap:"wrap"}}>
            {[["aprovacoes","Aprovações"],["agenda","Agenda"],["salas","Salas"],["horarios","Abrir / fechar"]].map(([t,l])=>(
              <button key={t} onClick={()=>setAdminTab(t)} style={{padding:"8px 18px",border:"none",borderRadius:8,background:adminTab===t?C.emerald:"transparent",color:adminTab===t?"#fff":C.muted,fontWeight:adminTab===t?700:500,cursor:"pointer",fontSize:13,fontFamily:F.body}}>
                {l}{t==="aprovacoes"&&signups.length>0?` (${signups.length})`:""}
              </button>
            ))}
          </div>

          {/* APROVAÇÕES — validação no conselho */}
          {adminTab==="aprovacoes" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.dark,marginBottom:6}}>Cadastros aguardando validação</h3>
              <p style={{color:C.muted,fontSize:13.5,marginBottom:18}}>Confira o registro no conselho antes de aprovar. Clique em "Validar no conselho" para abrir o site oficial.</p>
              {signups.length===0 ? (
                <div style={{background:C.white,borderRadius:16,padding:40,textAlign:"center",color:C.muted,boxShadow:"0 4px 16px rgba(0,0,0,0.06)"}}>✓ Nenhuma aprovação pendente.</div>
              ) : signups.map(s=>(
                <div key={s.id} style={{background:C.white,borderRadius:16,padding:"18px 22px",boxShadow:"0 4px 16px rgba(0,0,0,0.06)",marginBottom:12,borderLeft:`4px solid ${C.warn}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:14}}>
                    <div style={{flex:1,minWidth:200}}>
                      <div style={{fontWeight:700,color:C.dark,fontSize:15}}>{s.name}</div>
                      <div style={{color:C.muted,fontSize:13}}>{s.spec} · <strong>{s.council}</strong></div>
                      <div style={{fontSize:11.5,color:C.muted,marginTop:4}}>{s.date} · {s.docs}/3 documentos enviados</div>
                    </div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <button style={{background:C.info,color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:12.5,cursor:"pointer",fontFamily:F.body,fontWeight:600}}>🔎 Validar no conselho</button>
                      <button style={{background:C.cream,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 12px",fontSize:12.5,cursor:"pointer",color:C.dark,fontFamily:F.body}}>Ver docs</button>
                      <button onClick={()=>setSignups(p=>p.filter(x=>x.id!==s.id))} style={{background:C.emerald,color:"#fff",border:"none",borderRadius:8,padding:"8px 14px",fontSize:12.5,cursor:"pointer",fontFamily:F.body,fontWeight:600}}>✓ Aprovar</button>
                      <button onClick={()=>setSignups(p=>p.filter(x=>x.id!==s.id))} style={{background:"#FFF5F5",border:`1px solid #F3C6C6`,borderRadius:8,padding:"8px 12px",fontSize:12.5,cursor:"pointer",color:C.error,fontFamily:F.body}}>Recusar</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* AGENDA */}
          {adminTab==="agenda" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.dark,marginBottom:18}}>Agenda de hoje</h3>
              {TODAY_SCHEDULE.map((item,i)=>(
                <div key={i} style={{background:item.status==="cleaning"?C.cream:C.white,borderRadius:16,padding:"16px 22px",display:"flex",alignItems:"center",gap:18,boxShadow:"0 4px 16px rgba(0,0,0,0.06)",marginBottom:10,borderLeft:`4px solid ${item.status==="in_progress"?C.warn:item.status==="cleaning"?C.mint:item.status==="confirmed"?C.emerald:C.border}`}}>
                  <div style={{textAlign:"center",minWidth:56}}>
                    <div style={{fontFamily:F.display,fontWeight:700,color:C.dark,fontSize:16}}>{item.time}</div>
                    <div style={{color:C.muted,fontSize:11}}>até {item.end}</div>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,color:item.status==="cleaning"?C.mint:C.dark,fontSize:14}}>{item.prof}</div>
                    <div style={{color:C.muted,fontSize:12}}>{item.spec} · {ROOMS.find(r=>r.id===item.room)?.name}</div>
                  </div>
                  <div style={{padding:"5px 13px",borderRadius:100,fontSize:11,fontWeight:700,background:item.status==="in_progress"?C.warnLight:item.status==="cleaning"?C.mintLight:item.status==="confirmed"?C.mintLight:"#F5F5F5",color:item.status==="in_progress"?"#B9772A":item.status==="cleaning"?C.mint:item.status==="confirmed"?C.emerald:C.muted}}>
                    {item.status==="in_progress"?"⚡ Em andamento":item.status==="cleaning"?"🧹 Limpeza":item.status==="confirmed"?"✓ Confirmado":"⏳ Pendente"}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* SALAS */}
          {adminTab==="salas" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.dark,marginBottom:18}}>Status das salas agora</h3>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(240px,1fr))",gap:16}}>
                {ROOMS.map(r=>{
                  const busy=TODAY_SCHEDULE.find(s=>s.room===r.id&&s.status==="in_progress");
                  const next=TODAY_SCHEDULE.find(s=>s.room===r.id&&s.status==="confirmed");
                  const occ=!!busy||!r.available;
                  return (
                    <div key={r.id} style={{background:C.white,borderRadius:16,padding:20,boxShadow:"0 4px 16px rgba(0,0,0,0.06)",borderTop:`4px solid ${occ?C.error:C.emerald}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                        <div><span style={{fontSize:24}}>{r.img}</span><h3 style={{fontFamily:F.display,fontSize:14,fontWeight:700,color:C.dark,marginTop:6}}>{r.name}</h3></div>
                        <span style={{padding:"4px 12px",borderRadius:100,fontSize:11,fontWeight:700,background:occ?"#FFF5F5":C.mintLight,color:occ?C.error:C.emerald}}>{occ?"🔴 Ocupada":"🟢 Livre"}</span>
                      </div>
                      {busy&&<div style={{fontSize:12,color:C.muted,borderTop:`1px solid ${C.border}`,paddingTop:10}}><strong>Agora:</strong> {busy.prof} · até {busy.end}</div>}
                      {!occ&&next&&<div style={{fontSize:12,color:C.muted,borderTop:`1px solid ${C.border}`,paddingTop:10}}><strong>Próximo:</strong> {next.prof} · {next.time}</div>}
                      {!occ&&!next&&<div style={{fontSize:12,color:C.mint,borderTop:`1px solid ${C.border}`,paddingTop:10}}>✓ Livre pelo restante do dia</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ABRIR / FECHAR HORÁRIOS manualmente (senha admin) */}
          {adminTab==="horarios" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:700,color:C.dark,marginBottom:6}}>Abrir e fechar horários</h3>
              <p style={{color:C.muted,fontSize:13.5,marginBottom:18}}>Bloqueie ou libere um horário manualmente. Útil quando alguém chega na recepção ou uma sala precisa ficar reservada.</p>
              <div style={{background:C.white,borderRadius:16,padding:24,boxShadow:"0 4px 16px rgba(0,0,0,0.06)"}}>
                <div style={{fontSize:13,fontWeight:600,color:C.dark,marginBottom:12}}>Sala Clínica 3 · hoje</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:8}}>
                  {TIMES.map(t=>{
                    const blocked = blockedSlots.includes(t) || BUSY.includes(t);
                    return (
                      <button key={t} onClick={()=>setBlockedSlots(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])}
                        style={{padding:"12px 6px",border:"none",borderRadius:10,background:blocked?"#FFF5F5":C.mintLight,color:blocked?C.error:C.emerald,fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:F.body}}>
                        {t}<div style={{fontSize:9,marginTop:2,opacity:0.8}}>{blocked?"🔒 Fechado":"🟢 Aberto"}</div>
                      </button>
                    );
                  })}
                </div>
                <div style={{marginTop:16,fontSize:12,color:C.muted}}>Clique para alternar. Horários fechados não aparecem para os clientes reservarem.</div>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  };

  // ════════════════════════════════════════════ CHAT VI
  const Chat = () => (
    <>
      {!chatOpen && (
        <button onClick={()=>setChatOpen(true)} style={{position:"fixed",bottom:24,right:24,zIndex:1000,width:58,height:58,borderRadius:"50%",background:`linear-gradient(135deg,${C.forest},${C.emerald})`,border:"none",cursor:"pointer",fontSize:26,boxShadow:"0 8px 32px rgba(26,122,92,0.45)",display:"flex",alignItems:"center",justifyContent:"center"}} title="Falar com a Vi">🤖</button>
      )}
      {chatOpen && (
        <div style={{position:"fixed",bottom:chatFull?0:20,right:chatFull?0:20,zIndex:1000,width:chatFull?"100vw":360,height:chatFull?"100dvh":540,background:"#fff",borderRadius:chatFull?0:20,display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,0.22)",overflow:"hidden",transition:"all 0.3s"}}>
          <div style={{background:`linear-gradient(135deg,${C.forest},${C.emerald})`,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"rgba(255,255,255,0.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>🤖</div>
            <div style={{flex:1}}>
              <div style={{color:"#fff",fontWeight:700,fontSize:14}}>Vi — Assistente Vidah Prime</div>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{width:7,height:7,background:C.mint,borderRadius:"50%"}}/>
                <span style={{color:"rgba(255,255,255,0.72)",fontSize:11}}>Online · Tira dúvidas e conecta com a equipe</span>
              </div>
            </div>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setChatFull(f=>!f)} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:12}}>{chatFull?"⊡":"⊞"}</button>
              <button onClick={()=>{setChatOpen(false);setChatFull(false);}} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:14}}>✕</button>
            </div>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10}}>
            {msgs.map((m,i)=>(
              <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",flexDirection:m.role==="user"?"row-reverse":"row"}}>
                <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,background:m.role==="user"?C.gold:`linear-gradient(135deg,${C.forest},${C.emerald})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>{m.role==="user"?"👤":"🤖"}</div>
                <div style={{maxWidth:"78%",padding:"10px 14px",borderRadius:m.role==="user"?"18px 4px 18px 18px":"4px 18px 18px 18px",background:m.role==="user"?C.forest:C.cream,color:m.role==="user"?"#fff":C.dark,fontSize:13,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{m.content}</div>
              </div>
            ))}
            <div ref={chatEnd}/>
          </div>
          {msgs.length===1 && leadStage===0 && (
            <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",borderTop:`1px solid ${C.border}`,flexShrink:0}}>
              {["Ver salas","Quais os planos?","Como me cadastro?","Falar com a equipe"].map(q=>(
                <button key={q} onClick={()=>sendChat(q)} style={{background:C.mintLight,color:C.emerald,border:"none",borderRadius:100,padding:"5px 11px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:F.body}}>{q}</button>
              ))}
            </div>
          )}
          {leadStage===4 && (
            <div style={{padding:"8px 14px",borderTop:`1px solid ${C.border}`,flexShrink:0}}>
              <button onClick={()=>{setChatOpen(false);requireAccount("booking");}} style={{width:"100%",background:C.gold,color:"#fff",border:"none",borderRadius:10,padding:10,fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:F.body}}>Adiantar meu cadastro →</button>
            </div>
          )}
          <div style={{padding:"10px 14px",borderTop:`1px solid ${C.border}`,display:"flex",gap:8,flexShrink:0}}>
            <input value={chatIn} onChange={e=>setChatIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendChat()}
              placeholder="Digite sua dúvida..." style={{flex:1,padding:"9px 13px",border:`2px solid ${C.border}`,borderRadius:10,fontSize:13,outline:"none",fontFamily:F.body}}/>
            <button onClick={()=>sendChat()} disabled={!chatIn.trim()} style={{background:chatIn.trim()?C.emerald:"#CCC",border:"none",borderRadius:10,padding:"9px 13px",color:"#fff",cursor:chatIn.trim()?"pointer":"not-allowed",fontSize:16}}>➤</button>
          </div>
        </div>
      )}
    </>
  );

  // ════════════════════════════════════════════ RENDER
  return (
    <div style={{fontFamily:F.body,background:C.cream,minHeight:"100vh"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{-webkit-font-smoothing:antialiased;}
        a{cursor:pointer;}
        @media(max-width:768px){.nav-links{display:none!important;}.hamburger{display:block!important;}}
        @media(min-width:769px){.hamburger{display:none!important;}}
        @media print{body *{visibility:hidden;}#contract-print,#contract-print *{visibility:visible;}}
        input:focus,select:focus,textarea:focus{border-color:#1A7A5C!important;outline:none;}
        ::-webkit-scrollbar{width:6px;height:6px;}
        ::-webkit-scrollbar-thumb{background:#2DB88A;border-radius:4px;}
      `}</style>
      <Navbar/>
      {view==="landing" && <Landing/>}
      {view==="onboarding" && <Onboarding/>}
      {view==="booking" && <Booking/>}
      {view==="client" && <Client/>}
      {view==="admin" && <Admin/>}
      <Chat/>
      {!chatOpen && (
        <a href="https://wa.me/5515999999999" target="_blank" rel="noopener noreferrer"
          style={{position:"fixed",bottom:94,right:24,zIndex:999,width:50,height:50,borderRadius:"50%",background:"#25D366",cursor:"pointer",fontSize:24,boxShadow:"0 6px 20px rgba(37,211,102,0.45)",display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none"}}>💬</a>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VidahPrime />);
</script>
</body>
</html>
