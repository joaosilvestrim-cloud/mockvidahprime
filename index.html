function VidahPrime() {
  const [view,setView] = useState("landing");
  const [menu,setMenu] = useState(false);
  const [faq,setFaq] = useState(null);
  const [scrollY,setScrollY] = useState(0);

  const [account,setAccount] = useState(null);
  const [obStep,setObStep] = useState(0);
  const [obForm,setObForm] = useState({name:"",email:"",phone:"",cpf:"",council:"",councilType:"CRP",spec:"",docs:{carteira:false,endereco:false,pessoal:false},accept:false});
  const [pendingAction,setPendingAction] = useState(null);

  const [step,setStep] = useState(0);
  const [room,setRoom] = useState(null);
  const [useMode,setUseMode] = useState(null);
  const [pkg,setPkg] = useState(null);
  const [dates,setDates] = useState([]);
  const [times,setTimes] = useState([]);
  const [calM,setCalM] = useState(new Date().getMonth());
  const [calY,setCalY] = useState(new Date().getFullYear());
  const [pay,setPay] = useState("pix");
  const [fiscal,setFiscal] = useState(false);
  const [lastBooking,setLastBooking] = useState(null);

  const [hourBalance,setHourBalance] = useState(0);
  const [myBookings,setMyBookings] = useState([]);
  const [clientTab,setClientTab] = useState("resumo");

  const [adminLogged,setAdminLogged] = useState(false);
  const [adminTab,setAdminTab] = useState("aprovacoes");
  const [signups,setSignups] = useState(PENDING_SIGNUPS);
  const [blockedSlots,setBlockedSlots] = useState([]);

  const [chatOpen,setChatOpen] = useState(false);
  const [chatFull,setChatFull] = useState(false);
  const [leadStage,setLeadStage] = useState(0);
  const [lead,setLead] = useState({name:"",email:"",interest:""});
  const [msgs,setMsgs] = useState([{role:"assistant",content:"Olá! Sou a Vi, assistente da Vidah Prime.\n\nPosso ajudar com salas, planos, cadastro e agendamento. E se quiser, conecto você com a equipe.\n\nComo posso ajudar?"}]);
  const [chatIn,setChatIn] = useState("");
  const chatEnd = useRef(null);

  useEffect(()=>{
    const h = ()=>setScrollY(window.scrollY);
    window.addEventListener("scroll",h);
    return ()=>window.removeEventListener("scroll",h);
  },[]);
  useEffect(()=>{ chatEnd.current?.scrollIntoView({behavior:"smooth"}); },[msgs]);
  useEffect(()=>{
    if(view!=="landing") return;
    const els = document.querySelectorAll(".reveal,.reveal-fade");
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("reveal-in"); io.unobserve(e.target); } });
    },{threshold:0.12, rootMargin:"0px 0px -6% 0px"});
    els.forEach(el=>io.observe(el));
    return ()=>io.disconnect();
  },[view]);

  const go = (v,s=0) => { setView(v); setStep(s); setMenu(false); window.scrollTo(0,0); };
  const requireAccount = (nextView="booking") => {
    if(account && account.status==="approved"){ go(nextView,0); return; }
    setPendingAction(nextView); setObStep(account?3:0); go("onboarding");
  };
  const startBook = (r=null) => { if(r) setRoom(r); requireAccount("booking"); };

  const obCanNext = () => {
    if(obStep===0) return obForm.name&&obForm.email&&obForm.phone&&obForm.cpf;
    if(obStep===1) return obForm.council&&obForm.spec;
    if(obStep===2) return obForm.docs.carteira&&obForm.docs.endereco&&obForm.docs.pessoal;
    if(obStep===3) return obForm.accept;
    return true;
  };
  const submitSignup = () => { setAccount({...obForm,status:"pending",id:genId()}); setObStep(4); };
  const approveOwnAccount = () => { setAccount(a=>({...a,status:"approved"})); setObStep(5); };

  const getDays = (m,y) => {
    const fd = new Date(y,m,1).getDay(), total = new Date(y,m+1,0).getDate();
    const d = Array(fd).fill(null);
    for(let i=1;i<=total;i++) d.push(i);
    return d;
  };
  const isPast = (d) => d && new Date(calY,calM,d) < new Date(new Date().setHours(0,0,0,0));
  const isSoon = (d) => { if(!d) return false; const diff=(new Date(calY,calM,d)-new Date(new Date().setHours(0,0,0,0)))/86400000; return diff>=0&&diff<2; };
  const isDSel = (d) => d && dates.includes(`${calY}-${calM}-${d}`);
  const togDate = (d) => { if(!d||isPast(d)||isSoon(d)) return; const k=`${calY}-${calM}-${d}`; setDates(p=>p.includes(k)?p.filter(x=>x!==k):[...p,k]); };
  const togTime = (t) => setTimes(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);

  const hourRate = () => {
    if(!room) return 0;
    if(useMode?.id==="pacote"&&pkg) return room.priceHora*(1-pkg.off);
    if(useMode?.id==="periodo") return room.priceHora*(1-0.30);
    return room.priceHora;
  };
  const bookingTotal = () => {
    const slots = times.length*Math.max(dates.length,1);
    if(useMode?.id==="pacote"&&pkg) return room.priceHora*(1-pkg.off)*pkg.hours + (fiscal?FISCAL_ADDON.price:0);
    if(useMode?.id==="periodo") return room.priceHora*(1-0.30)*slots*4 + (fiscal?FISCAL_ADDON.price:0);
    return hourRate()*slots + (fiscal?FISCAL_ADDON.price:0);
  };
  const bookCanNext = () => {
    if(step===0) return !!room;
    if(step===1) return !!useMode && (useMode.id!=="pacote"||!!pkg);
    if(step===2) return dates.length>0&&times.length>0;
    return true;
  };
  const confirmBooking = () => {
    const b = { id:genId(), room, useMode, pkg, dates:[...dates], times:[...times], total:bookingTotal(), pay, fiscal, when:new Date() };
    setLastBooking(b); setMyBookings(p=>[b,...p]);
    if(useMode?.id==="pacote"&&pkg) setHourBalance(bal=>bal + pkg.hours - times.length*Math.max(dates.length,1));
    setStep(4);
  };

  const pushMsg = (role,content) => setMsgs(p=>[...p,{role,content}]);
  const botReply = (u) => {
    const t = u.toLowerCase();
    if(t.includes("sala")) return "Temos Sala Conecta (psicologia e terapias), Sala Clínica (procedimentos e maca), Sala Odontológica (equipada) e a Sala de Reuniões e Palestras. Quer que eu te leve pra ver as salas?";
    if(t.includes("plano")||t.includes("preç")||t.includes("valor")||t.includes("pacote")) return "Você pode alugar avulso por hora, comprar um pacote (8h, 16h ou 30h com desconto) ou fechar um período fixo. Quanto maior o pacote, mais barata a hora. Quer ver os valores?";
    if(t.includes("cadastr")||t.includes("document")) return "O cadastro é único: você envia carteirinha do conselho, comprovante de endereço e documento pessoal, assina o contrato uma vez e, após validarmos seu registro, já pode reservar. Posso começar seu cadastro?";
    if(t.includes("fiscal")||t.includes("cnpj")) return "Com o adicional de endereço fiscal (contratos de 12 meses) você usa nosso endereço no CNPJ e nos conselhos. Quer que eu chame a equipe pra detalhar?";
    if(t.includes("humano")||t.includes("equipe")||t.includes("falar")||t.includes("atend")) return "__LEAD__";
    return "Posso ajudar com salas, planos, cadastro, endereço fiscal e agendamento. Se preferir, falo com a equipe pra você. O que faz mais sentido?";
  };
  const sendChat = (directMsg=null) => {
    const u = (directMsg||chatIn).trim();
    if(!u) return;
    if(!directMsg) setChatIn("");
    pushMsg("user",u);
    if(leadStage===1){ setLead(l=>({...l,name:u})); setLeadStage(2); setTimeout(()=>pushMsg("assistant",`Prazer, ${u.split(" ")[0]}! Qual o melhor e-mail pra equipe te retornar?`),400); return; }
    if(leadStage===2){ setLead(l=>({...l,email:u})); setLeadStage(3); setTimeout(()=>pushMsg("assistant","Perfeito. Em uma frase, o que você procura? (ex.: 2 turnos de sala odontológica por semana)"),400); return; }
    if(leadStage===3){
      setLead(l=>({...l,interest:u})); setLeadStage(4);
      const score = Math.min(98, 60 + u.length%38);
      setTimeout(()=>pushMsg("assistant",`Tudo certo! Encaminhei seu contato para a equipe da Vidah Prime.\n\nLead registrado no CRM · Score do profissional: ${score}/100\n\nA Raquel ou o Fernando vão te retornar em breve. Enquanto isso, quer adiantar seu cadastro?`),500);
      return;
    }
    setTimeout(()=>{
      const r = botReply(u);
      if(r==="__LEAD__"){ setLeadStage(1); pushMsg("assistant","Claro! Vou te conectar com a equipe. Qual seu nome?"); }
      else pushMsg("assistant",r);
    },450);
  };

  const onLanding = view==="landing";
  const navSolid = !onLanding || scrollY>=70;
  const navColor = navSolid ? C.ink : "#fff";

  const btnPrimary = { background:C.teal, color:"#fff", border:"none", borderRadius:12, fontWeight:700, cursor:"pointer", fontFamily:F.body, boxShadow:"0 8px 22px rgba(20,160,139,0.32)", transition:"transform .15s, box-shadow .15s" };
  const btnGhost = { background:"transparent", color:C.ink, border:`1.5px solid ${C.line}`, borderRadius:12, fontWeight:600, cursor:"pointer", fontFamily:F.body };

  /* ═══════════ NAVBAR ═══════════ */
  const Navbar = () => (
    <nav style={{position:"fixed",top:0,left:0,right:0,zIndex:200,height:66,display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 22px",background:navSolid?"rgba(255,255,255,0.9)":"transparent",backdropFilter:navSolid?"blur(18px)":"none",borderBottom:navSolid?`1px solid ${C.line}`:"1px solid transparent",transition:"background .3s,border-color .3s"}}>
      <button onClick={()=>go("landing")} style={{background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:11}}>
        <LogoMark s={38}/>
        <Wordmark color={navColor} size={21}/>
      </button>
      <div className="nav-links" style={{display:"flex",gap:28,alignItems:"center"}}>
        {[["Salas","salas"],["Como funciona","como"],["Planos","planos"],["FAQ","faq"]].map(([l,id])=>(
          <a key={l} href={`#${id}`} style={{color:navColor,textDecoration:"none",fontSize:14.5,fontWeight:500,opacity:0.9}} onClick={e=>{ if(!onLanding){e.preventDefault();go("landing");} }}>{l}</a>
        ))}
        {account?.status==="approved" ? (
          <button onClick={()=>go("client")} style={{display:"flex",alignItems:"center",gap:7,background:navSolid?C.lilacSoft:"rgba(255,255,255,0.14)",color:navColor,border:"none",borderRadius:10,padding:"8px 14px",fontSize:13.5,cursor:"pointer",fontWeight:600}}>
            <Ic n="user" s={17} c={navColor}/> Minha conta
          </button>

          <button onClick={()=>requireAccount("client")} style={{background:"none",color:navColor,border:"none",fontSize:14,cursor:"pointer",fontWeight:600}}>Entrar</button>
        )}
        <button onClick={()=>go("admin")} title="Painel administrativo" style={{display:"flex",alignItems:"center",background:"none",color:navColor,border:"none",cursor:"pointer",opacity:0.7,padding:4}}>
          <Ic n="key" s={18} c={navColor}/>
        </button>
        <button onClick={()=>startBook()} style={{...btnPrimary,padding:"11px 22px",fontSize:14.5,display:"flex",alignItems:"center",gap:7}}>
          Reservar <Ic n="arrowR" s={17} c="#fff"/>

            <a key={l} href={`#${id}`} onClick={()=>{setMenu(false); if(!onLanding)go("landing");}} style={{color:C.ink,textDecoration:"none",fontWeight:600,fontSize:16}}>{l}</a>
          ))}
          <button onClick={()=>{account?.status==="approved"?go("client"):requireAccount("client");}} style={{...btnGhost,padding:13,fontSize:15,textAlign:"left",display:"flex",gap:8,alignItems:"center"}}><Ic n="user" s={18} c={C.ink}/> {account?.status==="approved"?"Minha conta":"Entrar / Cadastrar"}</button>
          <button onClick={()=>go("admin")} style={{...btnGhost,padding:13,fontSize:14,color:C.slate,display:"flex",gap:8,alignItems:"center"}}><Ic n="key" s={18} c={C.slate}/> Painel administrativo</button>
          <button onClick={()=>startBook()} style={{...btnPrimary,padding:14,fontSize:16}}>Reservar agora</button>
        </div>
      )}
    </nav>
  );

  /* ═══════════ LANDING ═══════════ */
  const Landing = () => (
    <div>
      {/* HERO */}
      <section style={{background:`linear-gradient(150deg, ${C.navyDeep} 0%, ${C.navy} 42%, ${C.indigo} 100%)`,minHeight:"100vh",display:"flex",alignItems:"center",padding:"120px 24px 70px",position:"relative",overflow:"hidden"}}>

            </h1>
            <p className="vp-anim" style={{color:"rgba(255,255,255,0.82)",fontSize:"clamp(16px,2vw,18.5px)",lineHeight:1.7,marginBottom:34,maxWidth:520,animationDelay:".15s"}}>
              Salas equipadas e validadas para profissionais da saúde. Cadastro seguro, contrato assinado uma vez e reserva por hora, pacote ou período.
            </p>
            <div className="vp-anim" style={{display:"flex",gap:14,flexWrap:"wrap",marginBottom:44,animationDelay:".25s"}}>
              <button onClick={()=>startBook()} style={{...btnPrimary,padding:"16px 32px",fontSize:16,display:"flex",alignItems:"center",gap:9}}>Quero me cadastrar <Ic n="arrowR" s={18} c="#fff"/></button>
              <a href="#salas" style={{background:"rgba(255,255,255,0.1)",color:"#fff",border:"1px solid rgba(255,255,255,0.28)",borderRadius:12,padding:"16px 28px",fontSize:16,fontWeight:600,textDecoration:"none",backdropFilter:"blur(10px)",display:"flex",alignItems:"center",gap:8}}>Ver salas</a>
            </div>
            <div className="vp-anim" style={{display:"flex",gap:"clamp(20px,4vw,44px)",flexWrap:"wrap",paddingTop:32,borderTop:"1px solid rgba(255,255,255,0.15)",animationDelay:".35s"}}>
              {[["200+","Profissionais"],["6","Salas"],["100%","Validados"],["24/7","Assistente Vi"]].map(([n,l])=>(
                <div key={l} style={{color:"#fff"}}>
                  <div style={{fontFamily:F.display,fontSize:"clamp(24px,3vw,32px)",fontWeight:600,color:"#7FE3D0"}}>{n}</div>

                </div>
              ))}
            </div>
          </div>
          {/* Cartão de vídeo */}

            <div style={{aspectRatio:"4/5",borderRadius:16,background:`linear-gradient(160deg, ${C.indigo}, ${C.navyDeep})`,position:"relative",overflow:"hidden",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
              <svg viewBox="0 0 300 375" preserveAspectRatio="none" style={{position:"absolute",inset:0,width:"100%",height:"100%"}}>
                <g fill="none" stroke="#fff" strokeOpacity="0.12" strokeWidth="1.3"><path d="M-20 120 Q120 40 300 110"/><path d="M-20 150 Q120 70 300 140"/><path d="M-20 180 Q120 100 300 170"/></g>
                <path d="M0 250 Q100 220 180 260 T320 250 V375 H0Z" fill={C.teal} fillOpacity="0.5"/>

          <div style={{marginBottom:24,textAlign:"left"}}>
            <label style={{fontSize:12.5,fontWeight:600,color:C.ink,display:"block",marginBottom:7}}>Senha</label>
            <input type="password" placeholder="••••••••" style={{width:"100%",padding:"12px 14px",border:`1.5px solid ${C.line}`,borderRadius:11,fontSize:14,boxSizing:"border-box",fontFamily:F.body}}/>
          </div>
          <button onClick={()=>setAdminLogged(true)} style={{width:"100%",...btnPrimary,padding:14,fontSize:15,marginBottom:12}}>Entrar no painel</button>
          <button onClick={()=>go("landing")} style={{width:"100%",background:"none",border:"none",color:C.slate,fontSize:12.5,cursor:"pointer",display:"flex",gap:6,alignItems:"center",justifyContent:"center"}}><Ic n="arrowL" s={15} c={C.slate}/> Voltar ao site</button>
        </div>
      </div>
    );
    return (
      <div style={{minHeight:"100vh",background:C.bg,paddingTop:66}}>
        <div style={{background:C.navyDeep,color:"#fff",padding:"15px 22px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:66,zIndex:50}}>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            <LogoMark s={32}/>
            <div>
              <div style={{fontFamily:F.body,fontWeight:800,fontSize:16}}>Vidah<span style={{color:C.teal,fontWeight:600}}> prime</span> · Admin</div>
              <div style={{fontSize:11.5,opacity:0.7}}>{new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
            </div>
          </div>
          <button onClick={()=>{setAdminLogged(false);go("landing");}} style={{background:"rgba(255,255,255,0.14)",border:"none",color:"#fff",borderRadius:9,padding:"8px 14px",cursor:"pointer",fontSize:12.5,display:"flex",gap:6,alignItems:"center"}}><Ic n="logout" s={16} c="#fff"/> Sair</button>
        </div>

        <div style={{maxWidth:1200,margin:"0 auto",padding:"22px 20px"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:14,marginBottom:24}}>
            {[{l:"Aprovações pendentes",v:signups.length,c:C.coral,ic:"clipboard"},{l:"Agendamentos hoje",v:TODAY_SCHEDULE.filter(s=>s.status!=="cleaning").length,c:C.teal,ic:"cal"},{l:"Em atendimento",v:TODAY_SCHEDULE.filter(x=>x.status==="in_progress").length,c:C.indigo,ic:"bolt"},{l:"Faturamento mês",v:"R$ 18,4k",c:C.lilac,ic:"wallet"}].map(s=>(
              <div key={s.l} style={{background:C.white,borderRadius:16,padding:"18px 18px",boxShadow:SH.sm,border:`1px solid ${C.line}`}}>
                <div style={{width:40,height:40,borderRadius:11,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}><Ic n={s.ic} s={20} c={s.c}/></div>
                <div style={{fontFamily:F.display,fontSize:25,fontWeight:600,color:s.c}}>{s.v}</div>
                <div style={{fontSize:11,color:C.faint,marginTop:5,textTransform:"uppercase",fontWeight:700,letterSpacing:1}}>{s.l}</div>
              </div>
            ))}
          </div>

          <div style={{display:"flex",gap:4,marginBottom:22,background:"#fff",borderRadius:12,padding:4,width:"fit-content",boxShadow:SH.sm,flexWrap:"wrap",border:`1px solid ${C.line}`}}>
            {[["aprovacoes","Aprovações"],["agenda","Agenda"],["salas","Salas"],["horarios","Abrir / fechar"]].map(([t,l])=>(
              <button key={t} onClick={()=>setAdminTab(t)} style={{padding:"9px 18px",border:"none",borderRadius:9,background:adminTab===t?C.indigo:"transparent",color:adminTab===t?"#fff":C.slate,fontWeight:adminTab===t?700:500,cursor:"pointer",fontSize:13}}>{l}{t==="aprovacoes"&&signups.length>0?` (${signups.length})`:""}</button>
            ))}
          </div>

          {adminTab==="aprovacoes" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:600,color:C.ink,marginBottom:6}}>Cadastros aguardando validação</h3>
              <p style={{color:C.slate,fontSize:13.5,marginBottom:18}}>Confira o registro no conselho antes de aprovar. Clique em "Validar no conselho" para abrir o site oficial.</p>
              {signups.length===0 ? (
                <div style={{background:C.white,borderRadius:16,padding:40,textAlign:"center",color:C.slate,boxShadow:SH.sm,border:`1px solid ${C.line}`,display:"flex",flexDirection:"column",alignItems:"center",gap:10}}><Ic n="checkCircle" s={30} c={C.teal}/> Nenhuma aprovação pendente.</div>
              ) : signups.map(s=>(
                <div key={s.id} style={{background:C.white,borderRadius:16,padding:"18px 22px",boxShadow:SH.sm,marginBottom:12,borderLeft:`4px solid ${C.coral}`,border:`1px solid ${C.line}`}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:14}}>
                    <div style={{flex:1,minWidth:200}}>
                      <div style={{fontWeight:700,color:C.ink,fontSize:15}}>{s.name}</div>
                      <div style={{color:C.slate,fontSize:13}}>{s.spec} · <strong>{s.council}</strong></div>
                      <div style={{fontSize:11.5,color:C.faint,marginTop:4}}>{s.date} · {s.docs}/3 documentos enviados</div>
                    </div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      <button style={{background:C.indigo,color:"#fff",border:"none",borderRadius:10,padding:"9px 14px",fontSize:12.5,cursor:"pointer",fontWeight:600,display:"flex",gap:6,alignItems:"center"}}><Ic n="searchCheck" s={15} c="#fff"/> Validar no conselho</button>
                      <button style={{...btnGhost,padding:"9px 12px",fontSize:12.5,display:"flex",gap:6,alignItems:"center"}}><Ic n="eye" s={15} c={C.ink}/> Docs</button>
                      <button onClick={()=>setSignups(p=>p.filter(x=>x.id!==s.id))} style={{background:C.teal,color:"#fff",border:"none",borderRadius:10,padding:"9px 14px",fontSize:12.5,cursor:"pointer",fontWeight:600,display:"flex",gap:6,alignItems:"center"}}><Ic n="check" s={15} c="#fff"/> Aprovar</button>
                      <button onClick={()=>setSignups(p=>p.filter(x=>x.id!==s.id))} style={{background:C.coralSoft,border:`1px solid ${C.coral}`,borderRadius:10,padding:"9px 12px",fontSize:12.5,cursor:"pointer",color:C.coralDeep}}>Recusar</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {adminTab==="agenda" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:600,color:C.ink,marginBottom:18}}>Agenda de hoje</h3>
              {TODAY_SCHEDULE.map((item,i)=>{
                const cor = item.status==="in_progress"?C.coral:item.status==="cleaning"?C.teal:item.status==="confirmed"?C.indigo:C.line;
                return (
                  <div key={i} style={{background:item.status==="cleaning"?C.bg:C.white,borderRadius:16,padding:"16px 22px",display:"flex",alignItems:"center",gap:18,boxShadow:SH.sm,marginBottom:10,borderLeft:`4px solid ${cor}`,border:`1px solid ${C.line}`}}>
                    <div style={{textAlign:"center",minWidth:56}}>
                      <div style={{fontFamily:F.display,fontWeight:600,color:C.ink,fontSize:16}}>{item.time}</div>
                      <div style={{color:C.faint,fontSize:11}}>até {item.end}</div>
                    </div>
                    <div style={{width:38,height:38,borderRadius:10,background:C.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n={item.status==="cleaning"?"droplet":"user"} s={19} c={item.status==="cleaning"?C.teal:C.slate}/></div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,color:item.status==="cleaning"?C.tealDeep:C.ink,fontSize:14}}>{item.prof}</div>
                      <div style={{color:C.slate,fontSize:12}}>{item.spec} · {ROOMS.find(r=>r.id===item.room)?.name}</div>
                    </div>
                    <div style={{padding:"5px 13px",borderRadius:100,fontSize:11,fontWeight:700,background:item.status==="in_progress"?C.coralSoft:item.status==="cleaning"?C.tealSoft:item.status==="confirmed"?C.lilacSoft:C.lineSoft,color:item.status==="in_progress"?C.coralDeep:item.status==="cleaning"?C.tealDeep:item.status==="confirmed"?C.indigo:C.slate}}>
                      {item.status==="in_progress"?"Em andamento":item.status==="cleaning"?"Limpeza":item.status==="confirmed"?"Confirmado":"Pendente"}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {adminTab==="salas" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:600,color:C.ink,marginBottom:18}}>Status das salas agora</h3>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:16}}>
                {ROOMS.map(r=>{
                  const busy=TODAY_SCHEDULE.find(s=>s.room===r.id&&s.status==="in_progress");
                  const next=TODAY_SCHEDULE.find(s=>s.room===r.id&&s.status==="confirmed");
                  const occ=!!busy||!r.available;
                  return (
                    <div key={r.id} style={{background:C.white,borderRadius:16,padding:20,boxShadow:SH.sm,borderTop:`4px solid ${occ?C.coral:C.teal}`,border:`1px solid ${C.line}`}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
                        <div style={{display:"flex",gap:10,alignItems:"center"}}>
                          <div style={{width:38,height:38,borderRadius:10,background:`linear-gradient(140deg,${r.accent},${r.accent2})`,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n={r.icon} s={19} c="#fff"/></div>
                          <h3 style={{fontFamily:F.display,fontSize:14.5,fontWeight:600,color:C.ink}}>{r.name}</h3>
                        </div>
                        <span style={{padding:"4px 12px",borderRadius:100,fontSize:11,fontWeight:700,background:occ?C.coralSoft:C.tealSoft,color:occ?C.coralDeep:C.tealDeep}}>{occ?"Ocupada":"Livre"}</span>
                      </div>
                      {busy&&<div style={{fontSize:12,color:C.slate,borderTop:`1px solid ${C.line}`,paddingTop:10}}><strong>Agora:</strong> {busy.prof} · até {busy.end}</div>}
                      {!occ&&next&&<div style={{fontSize:12,color:C.slate,borderTop:`1px solid ${C.line}`,paddingTop:10}}><strong>Próximo:</strong> {next.prof} · {next.time}</div>}
                      {!occ&&!next&&<div style={{fontSize:12,color:C.tealDeep,borderTop:`1px solid ${C.line}`,paddingTop:10,display:"flex",gap:6,alignItems:"center"}}><Ic n="check" s={15} c={C.teal}/> Livre pelo restante do dia</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {adminTab==="horarios" && (
            <div>
              <h3 style={{fontFamily:F.display,fontSize:20,fontWeight:600,color:C.ink,marginBottom:6}}>Abrir e fechar horários</h3>
              <p style={{color:C.slate,fontSize:13.5,marginBottom:18}}>Bloqueie ou libere um horário manualmente. Útil quando alguém chega na recepção ou uma sala precisa ficar reservada.</p>
              <div style={{background:C.white,borderRadius:16,padding:24,boxShadow:SH.sm,border:`1px solid ${C.line}`}}>
                <div style={{fontSize:13,fontWeight:600,color:C.ink,marginBottom:14}}>Sala Clínica 3 · hoje</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(96px,1fr))",gap:8}}>
                  {TIMES.map(t=>{
                    const blocked = blockedSlots.includes(t) || BUSY.includes(t);
                    return (
                      <button key={t} onClick={()=>setBlockedSlots(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t])} style={{padding:"12px 6px",border:"none",borderRadius:11,background:blocked?C.coralSoft:C.tealSoft,color:blocked?C.coralDeep:C.tealDeep,fontWeight:600,fontSize:13,cursor:"pointer"}}>
                        {t}<div style={{fontSize:9.5,marginTop:3,opacity:0.85}}>{blocked?"Fechado":"Aberto"}</div>
                      </button>
                    );
                  })}
                </div>
                <div style={{marginTop:16,fontSize:12,color:C.slate}}>Clique para alternar. Horários fechados não aparecem para os clientes reservarem.</div>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  };

  /* ═══════════ CHAT VI ═══════════ */
  const Chat = () => (
    <>
      {!chatOpen && (
        <button onClick={()=>setChatOpen(true)} style={{position:"fixed",bottom:24,right:24,zIndex:1000,width:60,height:60,borderRadius:"50%",background:`linear-gradient(140deg, ${C.indigo}, ${C.navy})`,border:"none",cursor:"pointer",boxShadow:"0 12px 32px rgba(38,35,94,0.4)",display:"flex",alignItems:"center",justifyContent:"center"}} title="Falar com a Vi">
          <Ic n="chat" s={26} c="#fff"/>
        </button>
      )}
      {chatOpen && (
        <div style={{position:"fixed",bottom:chatFull?0:20,right:chatFull?0:20,zIndex:1000,width:chatFull?"100vw":370,height:chatFull?"100dvh":560,background:"#fff",borderRadius:chatFull?0:22,display:"flex",flexDirection:"column",boxShadow:SH.xl,overflow:"hidden",transition:"all .3s",border:`1px solid ${C.line}`}}>
          <div style={{background:`linear-gradient(140deg, ${C.navyDeep}, ${C.indigo})`,padding:"15px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"rgba(255,255,255,0.18)",display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n="chat" s={19} c="#fff"/></div>
            <div style={{flex:1}}>
              <div style={{color:"#fff",fontWeight:700,fontSize:14}}>Vi · Assistente Vidah Prime</div>
              <div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:7,height:7,background:"#7FE3D0",borderRadius:"50%"}}/><span style={{color:"rgba(255,255,255,0.72)",fontSize:11}}>Tira dúvidas e conecta com a equipe</span></div>
            </div>
            <button onClick={()=>setChatFull(f=>!f)} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,padding:"6px",cursor:"pointer",display:"flex"}}><Ic n={chatFull?"x":"plus"} s={15} c="#fff"/></button>
            <button onClick={()=>{setChatOpen(false);setChatFull(false);}} style={{background:"rgba(255,255,255,0.15)",border:"none",borderRadius:8,padding:"6px",cursor:"pointer",display:"flex"}}><Ic n="x" s={15} c="#fff"/></button>
          </div>
          <div style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:10,background:C.bg}}>
            {msgs.map((m,i)=>(
              <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",flexDirection:m.role==="user"?"row-reverse":"row"}}>
                <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,background:m.role==="user"?C.coral:`linear-gradient(140deg,${C.indigo},${C.navy})`,display:"flex",alignItems:"center",justifyContent:"center"}}><Ic n={m.role==="user"?"user":"chat"} s={15} c="#fff"/></div>
                <div style={{maxWidth:"78%",padding:"10px 14px",borderRadius:m.role==="user"?"18px 4px 18px 18px":"4px 18px 18px 18px",background:m.role==="user"?C.indigo:"#fff",color:m.role==="user"?"#fff":C.ink,fontSize:13,lineHeight:1.65,whiteSpace:"pre-wrap",border:m.role==="user"?"none":`1px solid ${C.line}`}}>{m.content}</div>
              </div>
            ))}
            <div ref={chatEnd}/>
          </div>
          {msgs.length===1 && leadStage===0 && (
            <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",borderTop:`1px solid ${C.line}`,flexShrink:0}}>
              {["Ver salas","Quais os planos?","Como me cadastro?","Falar com a equipe"].map(q=>(
                <button key={q} onClick={()=>sendChat(q)} style={{background:C.tealSoft,color:C.tealDeep,border:"none",borderRadius:100,padding:"6px 12px",fontSize:11.5,fontWeight:600,cursor:"pointer"}}>{q}</button>
              ))}
            </div>
          )}
          {leadStage===4 && (
            <div style={{padding:"8px 14px",borderTop:`1px solid ${C.line}`,flexShrink:0}}>
              <button onClick={()=>{setChatOpen(false);requireAccount("booking");}} style={{width:"100%",...btnPrimary,padding:11,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>Adiantar meu cadastro <Ic n="arrowR" s={16} c="#fff"/></button>
            </div>
          )}
          <div style={{padding:"10px 14px",borderTop:`1px solid ${C.line}`,display:"flex",gap:8,flexShrink:0}}>
            <input value={chatIn} onChange={e=>setChatIn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&sendChat()} placeholder="Digite sua dúvida..." style={{flex:1,padding:"10px 13px",border:`1.5px solid ${C.line}`,borderRadius:11,fontSize:13,outline:"none",fontFamily:F.body}}/>
            <button onClick={()=>sendChat()} disabled={!chatIn.trim()} style={{background:chatIn.trim()?C.teal:C.line,border:"none",borderRadius:11,padding:"0 14px",cursor:chatIn.trim()?"pointer":"not-allowed",display:"flex",alignItems:"center"}}><Ic n="arrowR" s={18} c="#fff"/></button>
          </div>
        </div>
      )}
    </>
  );

  return (
    <div style={{fontFamily:F.body,background:C.bg,minHeight:"100vh"}}>
      <style>{`
        @media(max-width:860px){.nav-links{display:none!important;}.hamburger{display:flex!important;}.hero-grid{grid-template-columns:1fr!important;}.hero-video{display:none!important;}}
        @media(min-width:861px){.hamburger{display:none!important;}}
        @keyframes vpFadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
        @keyframes vpFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
        @keyframes vpDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,14px) scale(1.06)}}
        @keyframes vpPulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(2.1);opacity:0}100%{opacity:0}}
        .vp-anim{opacity:0;animation:vpFadeUp .85s cubic-bezier(.2,.7,.2,1) both}
        .vp-float{transform-box:fill-box;transform-origin:center;animation:vpFloat 8s ease-in-out infinite}
        .vp-float2{transform-box:fill-box;transform-origin:center;animation:vpDrift 11s ease-in-out infinite}
        .vp-pulse-ring{position:absolute;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,0.55);animation:vpPulse 2.4s ease-out infinite}
        .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
        .reveal.reveal-in{opacity:1;transform:none}
        .reveal-fade{opacity:0}
        .reveal-fade.reveal-in{opacity:1}
        @media(prefers-reduced-motion:reduce){.vp-anim,.reveal,.reveal-fade{animation:none!important;opacity:1!important;transform:none!important}.vp-float,.vp-float2,.vp-pulse-ring{animation:none!important}}
      `}</style>
      {Navbar()}
      {view==="landing" && Landing()}
      {view==="onboarding" && Onboarding()}
      {view==="booking" && Booking()}
      {view==="client" && Client()}
      {view==="admin" && Admin()}
      {Chat()}
      {!chatOpen && (
        <a href="https://wa.me/5515999999999" target="_blank" rel="noopener noreferrer" style={{position:"fixed",bottom:96,right:24,zIndex:999,width:50,height:50,borderRadius:"50%",background:"#25D366",cursor:"pointer",boxShadow:"0 8px 22px rgba(37,211,102,0.42)",display:"flex",alignItems:"center",justifyContent:"center",textDecoration:"none"}}>
          <Ic n="whatsapp" s={24} c="#fff"/>
        </a>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VidahPrime />);
</script>
</body>
</html>
